[package]
name = "kinetic-network-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys.workspace = true
libp2p = { workspace = true, features = ["kad"] }
tempfile.workspace = true
kinetic-storage = { path = "../../kinetic-storage" }
kinetic-core = { path = "../../kinetic-core" }
kinetic-vdf = { path = "../../kinetic-vdf" }
[dependencies.kinetic-network]
path = ".."

[[bin]]
name = "fuzz_put_record"
path = "fuzz_targets/fuzz_put_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_get_record"
path = "fuzz_targets/fuzz_get_record.rs"
test = false
doc = false
bench = false
