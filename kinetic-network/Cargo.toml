[package]
name = "kinetic-network"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kinetic-core = { path = "../kinetic-core" }
kinetic-storage = { path = "../kinetic-storage" }
kinetic-kid = { path = "../kinetic-kid" }
libp2p = { version = "0.53", features = ["kad", "gossipsub", "noise", "yamux", "macros", "identify", "relay", "dcutr", "ping", "request-response", "cbor", "autonat", "upnp"] }
tokio = { version = "1.38.0", features = ["sync", "macros"] }
sha2 = "0.10"
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
ed25519-dalek = "2.2.0"
serde_json = "1.0.150"
kinetic-vdf = { version = "0.1.0", path = "../kinetic-vdf" }
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
lru = "0.12.3"
argon2 = "0.5"
web-time = "1.1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
libp2p = { version = "0.53", features = ["wasm-bindgen", "websocket-websys"] }
wasm-bindgen-futures = "0.4"
futures-timer = { version = "3.0.3", features = ["wasm-bindgen"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros"] }
libp2p = { version = "0.53", features = ["tokio", "tcp", "dns", "mdns"] }
libp2p-webrtc = "0.9.0-alpha.1"
libp2p-stream = "0.1.0-alpha"
futures-timer = "3.0.3"

[target.wasm32-unknown-unknown.dependencies]
libp2p-webrtc-websys = "0.4.0"

[dev-dependencies]
tempfile = "3.27.0"
rand_core = { version = "0.6.4", features = ["std"] }
