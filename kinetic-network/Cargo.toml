[package]
name = "kinetic-network"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The libp2p network mesh, swarm routing, and Drand entropy client for the Kinetic Network."
readme = "README.md"

[dependencies]
anyhow.workspace = true
argon2 = "0.6.0"
async-trait.workspace = true
base64.workspace = true
bytes = { workspace = true, features = ["serde"] }
drand-verify = "0.6.2"
ed25519-dalek.workspace = true
hex.workspace = true
kinetic-core = { path = "../kinetic-core" }
kinetic-kid = { path = "../kinetic-kid" }
kinetic-local = { path = "../kinetic-local" }
kinetic-primitives = { path = "../kinetic-primitives" }
kinetic-storage = { path = "../kinetic-storage" }
kinetic-types = { path = "../kinetic-types" }
kinetic-vdf = { path = "../kinetic-vdf" }
kinetic-verify = { path = "../kinetic-verify" }
libp2p = { workspace = true, features = ["kad", "gossipsub", "noise", "yamux", "macros", "identify", "relay", "dcutr", "ping", "request-response", "cbor", "autonat", "upnp", "quic", "dns"] }
lru = "0.18.3"
rand.workspace = true
reqwest = { workspace = true, features = ["json"] }
rustc-hash = "2.1.3"
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "macros"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
web-time = "1.1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures = "0.3.34"
futures-timer = { version = "3.0.4", features = ["wasm-bindgen"] }
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
gloo-timers = { version = "0.4.0", features = ["futures"] }
libp2p = { workspace = true, features = ["websocket-websys", "webrtc-websys"] }
wasm-bindgen-futures = "0.4.77"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-timer = "3.0.4"
hickory-resolver.workspace = true
libp2p = { workspace = true, features = ["tokio", "tcp", "mdns"] }
libp2p-stream = "0.4.0-alpha"
libp2p-webrtc = { version = "0.9.0-alpha.1", features = ["tokio", "pem"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros"] }

[dev-dependencies]
base64.workspace = true
kinetic-core = { path = "../kinetic-core", features = ["simulation"] }
proptest.workspace = true
rand_core = { workspace = true, features = ["std"] }
tempfile.workspace = true
tracing-subscriber.workspace = true

[[bench]]
name = "pow_benchmark"
harness = false

