[package]
name = "kinetic-network"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The libp2p network mesh, swarm routing, and Drand entropy client for the Kinetic Network."
readme = "README.md"

[dependencies]
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes = { workspace = true, features = ["serde"] }
drand-verify.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
kinetic-core = { path = "../kinetic-core" }
kinetic-kid = { path = "../kinetic-kid" }
kinetic-local = { path = "../kinetic-local" }
kinetic-primitives = { path = "../kinetic-primitives" }
kinetic-storage = { path = "../kinetic-storage" }
kinetic-types = { path = "../kinetic-types" }
kinetic-vdf = { path = "../kinetic-vdf" }
kinetic-verify = { path = "../kinetic-verify" }
libp2p = { workspace = true, features = ["kad", "gossipsub", "noise", "yamux", "macros", "identify", "relay", "dcutr", "ping", "request-response", "cbor", "autonat", "upnp", "quic", "dns"] }
lru.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["json"] }
rustc-hash.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "macros"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
web-time.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures.workspace = true
futures-timer = { workspace = true, features = ["wasm-bindgen"] }
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
gloo-timers = { workspace = true, features = ["futures"] }
libp2p = { workspace = true, features = ["websocket-websys", "webrtc-websys"] }
wasm-bindgen-futures.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-timer.workspace = true
hickory-resolver.workspace = true
libp2p = { workspace = true, features = ["tokio", "tcp", "mdns"] }
libp2p-stream.workspace = true
libp2p-webrtc = { workspace = true, features = ["tokio", "pem"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros"] }

[dev-dependencies]
base64.workspace = true
kinetic-core = { path = "../kinetic-core", features = ["simulation"] }
proptest.workspace = true
rand_core = { workspace = true, features = ["std"] }
tempfile.workspace = true
tracing-subscriber.workspace = true

[[bench]]
name = "pow_benchmark"
harness = false

