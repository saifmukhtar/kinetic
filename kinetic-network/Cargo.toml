[package]
name = "kinetic-network"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kinetic-core = { path = "../kinetic-core" }
kinetic-storage = { path = "../kinetic-storage" }
kinetic-kid = { path = "../kinetic-kid" }
kinetic-types = { version = "0.2.0", path = "../kinetic-types" }
libp2p = { version = "0.53", features = ["kad", "gossipsub", "noise", "yamux", "macros", "identify", "relay", "dcutr", "ping", "request-response", "cbor", "autonat", "upnp", "quic"] }
tokio = { version = "1.38.0", features = ["sync", "macros"] }
sha2 = "0.10"
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
ed25519-dalek = "2.2.0"
serde_json = "1.0.150"
ml-dsa = "0.1.1"
kinetic-vdf = { version = "0.2.0", path = "../kinetic-vdf" }
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive", "rc"] }
uuid = { version = "1.2.3", features = ["v4"] }
lru = "0.12.3"
argon2 = "0.5"
web-time = "1.1.0"
arc-swap = "1.9.2"
bytes = { version = "1.12.1", features = ["serde"] }
serde_bytes = "0.11.19"
rustc-hash = "2.1.3"
base64 = "0.22"
drand-verify = "0.6.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
libp2p = { version = "0.53", features = ["wasm-bindgen", "websocket-websys"] }
wasm-bindgen-futures = "0.4"
futures = "0.3"
futures-timer = { version = "3.0.3", features = ["wasm-bindgen"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros"] }
libp2p = { version = "0.53", features = ["tokio", "tcp", "dns", "mdns"] }
libp2p-stream = "0.1.0-alpha"
futures-timer = "3.0.3"
hickory-resolver = "0.24.4"

[dev-dependencies]
tempfile = "3.27.0"
rand_core = { version = "0.6.4", features = ["std"] }
proptest = "1.4.0"
tracing-subscriber = "0.3.18"
ml-dsa = "0.1.1"
kinetic-core = { path = "../kinetic-core", features = ["simulation"] }
base64 = "0.22"

[[bench]]
name = "pow_benchmark"
harness = false

