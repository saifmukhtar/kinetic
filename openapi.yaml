openapi: 3.0.3
info:
  title: Kinetic Daemon API
  version: 0.1.0
  description: The HTTP REST API exposed by the Kinetic Daemon for domain management, VDF proofs, and resolution.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://127.0.0.1:16002/api
    description: Local daemon API
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    PublishResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
      required:
        - status
        - message
    VdfTaskStatus:
      type: object
      properties:
        status:
          type: string
        iterations:
          type: integer
        progress:
          type: integer
        error:
          type: string
          nullable: true
      required:
        - status
        - iterations
        - progress
    DnsRecord:
      type: object
      properties:
        type:
          type: string
          enum: [A, AAAA, CNAME, TXT, PeerId, KID]
        value:
          type: string
      required:
        - type
        - value
    DnsZone:
      type: object
      properties:
        records:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/DnsRecord'
    VdfProof:
      type: object
      properties:
        proof_bytes:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 255
      required:
        - proof_bytes
    PreviousProof:
      type: object
      properties:
        salt:
          type: array
          items:
            type: integer
        drand_pulse:
          type: integer
        drand_randomness:
          type: string
        iterations:
          type: integer
        vdf_proof:
          $ref: '#/components/schemas/VdfProof'
        signature:
          type: array
          items:
            type: integer
      required:
        - salt
        - drand_pulse
        - drand_randomness
        - iterations
        - vdf_proof
        - signature
    Reveal:
      type: object
      properties:
        protocol_version:
          type: integer
          default: 2
        name:
          type: string
        payload:
          type: array
          items:
            type: integer
        salt:
          type: array
          items:
            type: integer
        drand_pulse:
          type: integer
        drand_randomness:
          type: string
        iterations:
          type: integer
        vdf_proof:
          $ref: '#/components/schemas/VdfProof'
        pubkey:
          type: array
          items:
            type: integer
        signature:
          type: array
          items:
            type: integer
        previous_proof:
          $ref: '#/components/schemas/PreviousProof'
          nullable: true
        miner_pubkey:
          type: array
          items:
            type: integer
          nullable: true
      required:
        - protocol_version
        - name
        - payload
        - salt
        - drand_pulse
        - drand_randomness
        - iterations
        - vdf_proof
        - pubkey
        - signature
    Commitment:
      type: object
      properties:
        hash:
          type: array
          items:
            type: integer
      required:
        - hash
    CommitRequest:
      type: object
      properties:
        name:
          type: string
        commitment:
          $ref: '#/components/schemas/Commitment'
      required:
        - name
        - commitment
    PublishRequest:
      type: object
      properties:
        reveal:
          $ref: '#/components/schemas/Reveal'
      required:
        - reveal
    VdfRegisterRequest:
      type: object
      properties:
        name:
          type: string
        iterations:
          type: integer
          nullable: true
      required:
        - name
    NameRenewRequest:
      type: object
      properties:
        name:
          type: string
        iterations:
          type: integer
          nullable: true
      required:
        - name
    KidDocument:
      type: object
      properties:
        doc_type:
          type: string
        kid:
          type: string
        created_at:
          type: integer
        controller_keys:
          type: array
          items:
            type: string
        manifest:
          type: object
          nullable: true
        revocation_keys:
          type: array
          items:
            type: string
        signature:
          type: string
          nullable: true
      required:
        - doc_type
        - kid
        - created_at
        - controller_keys
        - revocation_keys
    AuthorizedKid:
      type: object
      properties:
        name:
          type: string
        kid_doc:
          $ref: '#/components/schemas/KidDocument'
        owner_signature:
          type: array
          items:
            type: integer
      required:
        - name
        - kid_doc
        - owner_signature
    CapabilityManifest:
      type: object
      properties:
        doc_type:
          type: string
        kid:
          type: string
        version:
          type: integer
        valid_from:
          type: integer
        services:
          type: array
          items:
            type: object
        signature:
          type: string
          nullable: true
      required:
        - doc_type
        - kid
        - version
        - valid_from
        - services
    AuthorizedManifest:
      type: object
      properties:
        name:
          type: string
        manifest:
          $ref: '#/components/schemas/CapabilityManifest'
        owner_signature:
          type: array
          items:
            type: integer
      required:
        - name
        - manifest
        - owner_signature

paths:
  /health:
    get:
      summary: Get daemon health status
      tags: [Public]
      responses:
        '200':
          description: Health status object
          content:
            application/json:
              schema:
                type: object
  /peer_id:
    get:
      summary: Get local peer ID
      tags: [Public]
      responses:
        '200':
          description: Peer ID string
          content:
            text/plain:
              schema:
                type: string
  /network-status:
    get:
      summary: Get network status
      tags: [Public]
      responses:
        '200':
          description: Network status object
          content:
            application/json:
              schema:
                type: object
  /governance:
    get:
      summary: Get current governance state
      tags: [Public]
      responses:
        '200':
          description: Governance state binary data
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /time:
    get:
      summary: Get verified Kinetic network time
      tags: [Public]
      responses:
        '200':
          description: Kinetic time object
          content:
            application/json:
              schema:
                type: object
  /resolve/{name}:
    get:
      summary: Resolve a Kinetic name
      tags: [Public]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found Reveal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reveal'
  /resolve-kid/{did}:
    get:
      summary: Resolve a KID
      tags: [Public]
      parameters:
        - in: path
          name: did
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found KID and Manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  kid_document:
                    $ref: '#/components/schemas/KidDocument'
                  manifest_document:
                    $ref: '#/components/schemas/CapabilityManifest'
  /zone/{name}:
    get:
      summary: Get local DNS zone file
      tags: [Public]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found Zone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsZone'
    post:
      summary: Save local DNS zone file
      description: Requires Publish or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DnsZone'
      responses:
        '200':
          description: Saved
  /zone/{name}/publish:
    post:
      summary: Cryptographically sign and publish local zone to DHT
      description: Requires Publish or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published
  /commit:
    post:
      summary: Commit a name hash to DHT
      description: Requires Publish or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: Committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /publish:
    post:
      summary: Publish a name reveal to DHT
      description: Requires Publish or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /publish-kid:
    post:
      summary: Publish a KID to DHT
      description: Requires Publish or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizedKid'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /publish-manifest:
    post:
      summary: Publish a Capability Manifest to DHT
      description: Requires Publish or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizedManifest'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /publish-governance:
    post:
      summary: Publish a Governance action to DHT
      description: Requires Governance or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /config:
    get:
      summary: Get config
      description: Requires Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Config Object
    post:
      summary: Update config
      description: Requires Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
      responses:
        '200':
          description: Config Updated
  /owned-names:
    get:
      summary: Get list of locally owned names
      description: Requires Publish or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /vdf/register:
    post:
      summary: Start VDF name registration task
      description: Requires VDF or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VdfRegisterRequest'
      responses:
        '200':
          description: Task started
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                  message:
                    type: string
  /vdf/renew:
    post:
      summary: Start VDF name renewal task
      description: Requires VDF or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameRenewRequest'
      responses:
        '200':
          description: Task started
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                  message:
                    type: string
  /vdf/status/{task_id}:
    get:
      summary: Get status of a VDF task
      description: Requires VDF or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VdfTaskStatus'
    delete:
      summary: Delete a VDF task from memory
      description: Requires VDF or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
  /gossip/subscribe/{topic}:
    get:
      summary: Subscribe to a Gossipsub topic via Server-Sent Events (SSE)
      tags: [Public]
      parameters:
        - in: path
          name: topic
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SSE Stream
          content:
            text/event-stream:
              schema:
                type: string
  /gossip/publish/{topic}:
    post:
      summary: Broadcast a payload to a Gossipsub topic
      description: Requires Publish or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: topic
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
