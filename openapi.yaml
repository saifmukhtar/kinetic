openapi: 3.0.3
info:
  title: Kinetic Daemon API
  version: 0.1.0
  description: The HTTP REST API exposed by the Kinetic Daemon for domain management, VDF proofs, and resolution.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: "{scheme}://{host}:{port}/api"
    description: Kinetic daemon API — configure host and port at runtime
    variables:
      scheme:
        default: http
        enum: [http, https]
        description: Transport scheme (http for local, https for remote/TLS deployments)
      host:
        default: "127.0.0.1"
        description: Daemon bind address — override per deployment
      port:
        default: "16002"
        description: Daemon API port — override per deployment
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CreateSessionRequest:
      type: object
      properties:
        app_name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [admin, kid, nrs, vdf, action, gossip, metric, system, atlas]
        expiry_kyn:
          type: integer
          format: uint64
      required:
        - app_name
        - scopes
        - expiry_kyn
    AppSession:
      type: object
      properties:
        id:
          type: string
        token:
          type: string
        app_name:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: integer
        expiry_kyn:
          type: integer
          format: uint64
      required:
        - id
        - token
        - app_name
        - scopes
        - created_at
        - expiry_kyn
    ListSessionsResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AppSession'
      required:
        - sessions
    PublishResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
      required:
        - status
        - message
    ConfigResponse:
      type: object
      properties:
        status:
          type: string
        mode:
          type: string
      required:
        - status
        - mode
    VdfTaskStatus:
      type: object
      properties:
        status:
          type: string
        iterations:
          type: integer
        progress:
          type: integer
        error:
          type: string
          nullable: true
      required:
        - status
        - iterations
        - progress
    NrsRecord:
      type: object
      properties:
        type:
          type: string
          enum: [A, AAAA, CNAME, TXT, PeerId, KID]
        value:
          type: string
      required:
        - type
        - value
    NrsZone:
      type: object
      properties:
        records:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/NrsRecord'
    VdfProof:
      type: object
      properties:
        proof_bytes:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 255
      required:
        - proof_bytes
    PreviousProof:
      type: object
      properties:
        salt:
          type: array
          items:
            type: integer
        kyn:
          type: integer
        drand_signature:
          type: string
        iterations:
          type: integer
        vdf_proof:
          $ref: '#/components/schemas/VdfProof'
        signature:
          type: array
          items:
            type: integer
      required:
        - salt
        - kyn
        - drand_signature
        - iterations
        - vdf_proof
        - signature
    Reveal:
      type: object
      properties:
        protocol_version:
          type: integer
          default: 2
        name:
          type: string
        payload:
          type: array
          items:
            type: integer
        salt:
          type: array
          items:
            type: integer
        kyn:
          type: integer
        drand_signature:
          type: string
        iterations:
          type: integer
        vdf_proof:
          $ref: '#/components/schemas/VdfProof'
        pubkey:
          type: array
          items:
            type: integer
        signature:
          type: array
          items:
            type: integer
        previous_proof:
          $ref: '#/components/schemas/PreviousProof'
          nullable: true
        miner_pubkey:
          type: array
          items:
            type: integer
          nullable: true
      required:
        - protocol_version
        - name
        - payload
        - salt
        - kyn
        - drand_signature
        - iterations
        - vdf_proof
        - pubkey
        - signature
    Commitment:
      type: object
      properties:
        hash:
          type: array
          items:
            type: integer
      required:
        - hash
    CommitRequest:
      type: object
      properties:
        name:
          type: string
        commitment:
          $ref: '#/components/schemas/Commitment'
      required:
        - name
        - commitment
    PublishRequest:
      type: object
      properties:
        reveal:
          $ref: '#/components/schemas/Reveal'
      required:
        - reveal
    VdfRegisterRequest:
      type: object
      properties:
        name:
          type: string
        iterations:
          type: integer
          nullable: true
      required:
        - name
    NameRenewRequest:
      type: object
      properties:
        name:
          type: string
        iterations:
          type: integer
          nullable: true
      required:
        - name
    KidDocument:
      type: object
      properties:
        doc_type:
          type: string
        kid:
          type: string
        created_at:
          type: integer
        controller_keys:
          type: array
          items:
            type: string
        manifest:
          type: object
          nullable: true
        revocation_keys:
          type: array
          items:
            type: string
        signature:
          type: string
          nullable: true
      required:
        - doc_type
        - kid
        - created_at
        - controller_keys
        - revocation_keys
    AuthorizedKid:
      type: object
      properties:
        name:
          type: string
        kid_doc:
          $ref: '#/components/schemas/KidDocument'
        owner_signature:
          type: array
          items:
            type: integer
      required:
        - name
        - kid_doc
        - owner_signature
    CapabilityManifest:
      type: object
      properties:
        doc_type:
          type: string
        kid:
          type: string
        version:
          type: integer
        valid_from:
          type: integer
        services:
          type: array
          items:
            type: object
        signature:
          type: string
          nullable: true
      required:
        - doc_type
        - kid
        - version
        - valid_from
        - services
    AuthorizedManifest:
      type: object
      properties:
        name:
          type: string
        manifest:
          $ref: '#/components/schemas/CapabilityManifest'
        owner_signature:
          type: array
          items:
            type: integer
      required:
        - name
        - manifest
        - owner_signature

paths:
  /api/v1/micro/health:
    get:
      operationId: getHealth
      summary: Health check endpoint [Public]
      tags: [System]
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
  /api/v1/micro/network/peer-id:
    get:
      operationId: getPeerId
      summary: Get the local node's Peer ID [Public]
      tags: [Network]
      responses:
        '200':
          description: Peer ID
          content:
            text/plain:
              schema:
                type: string
  /api/v1/micro/network/status:
    get:
      operationId: getNetworkStatus
      summary: Get Swarm/DHT networking status [Public]
      tags: [Network]
      responses:
        '200':
          description: Network status info
          content:
            application/json:
              schema:
                type: object
  /api/v1/micro/action/status:
    get:
      operationId: getGovernance
      summary: Get current network action state [Public]
      tags: [Action]
      responses:
        '200':
          description: Action state binary data
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /api/v1/micro/time/current:
    get:
      operationId: getTime
      summary: Get verified Kinetic network time [Public]
      tags: [System]
      responses:
        '200':
          description: Kinetic time object
          content:
            application/json:
              schema:
                type: object
  /api/v1/micro/nrs/resolve/{name}:
    get:
      operationId: resolveName
      summary: Resolve a Kinetic name [Public]
      tags: [NRS]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found Reveal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reveal'
  /api/v1/micro/kid/resolve/{did}:
    get:
      operationId: resolveKid
      summary: Resolve a KID [Public]
      tags: [KID]
      parameters:
        - in: path
          name: did
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found KID and Manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  kid_document:
                    $ref: '#/components/schemas/KidDocument'
                  manifest_document:
                    $ref: '#/components/schemas/CapabilityManifest'
  /api/v1/micro/nrs/names/reserved:
    get:
      operationId: getReservedNames
      summary: Get the list of all reserved names for the current network [Public]
      tags: [NRS]
      responses:
        '200':
          description: List of reserved names with their active local status
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    active:
                      type: boolean
  /api/v1/micro/nrs/zone/local/{name}:
    get:
      operationId: getLocalReservedZone
      summary: Get local NRS override for a reserved name [Public]
      tags: [NRS]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found Zone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NrsZone'
    post:
      operationId: saveLocalReservedZone
      summary: Save local NRS override for a reserved name [Private]
      description: Requires Nrs or Admin role.
      tags: [NRS]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NrsZone'
      responses:
        '200':
          description: Saved
    delete:
      operationId: deleteLocalReservedZone
      summary: Delete local NRS override for a reserved name [Private]
      description: Requires Nrs or Admin role.
      tags: [NRS]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
  /api/v1/micro/nrs/zone/{name}:
    get:
      operationId: getZone
      summary: Get local NRS zone file [Public]
      tags: [NRS]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found Zone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NrsZone'
    post:
      operationId: saveZone
      summary: Save local NRS zone file [Private]
      description: Requires Nrs or Admin role.
      tags: [NRS]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NrsZone'
      responses:
        '200':
          description: Saved
  /api/v1/micro/nrs/zone/{name}/publish:
    post:
      operationId: publishZone
      summary: Cryptographically sign and publish local zone to DHT [Private]
      description: Requires Nrs or Admin role.
      tags: [NRS]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published
  /api/v1/micro/nrs/record/commit:
    post:
      operationId: commitName
      summary: Commit a name hash to DHT [Private]
      description: Requires Nrs or Admin role.
      tags: [NRS]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: Committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /api/v1/micro/nrs/record/publish:
    post:
      operationId: publishName
      summary: Publish a name reveal to DHT [Private]
      description: Requires Nrs or Admin role.
      tags: [NRS]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /api/v1/micro/kid/publish:
    post:
      operationId: publishKid
      summary: Publish a KID to DHT [Private]
      description: Requires Kid or Admin role.
      tags: [KID]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizedKid'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /api/v1/micro/kid/manifest/publish:
    post:
      operationId: publishManifest
      summary: Publish a Capability Manifest to DHT [Private]
      description: Requires Kid or Admin role.
      tags: [KID]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizedManifest'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /api/v1/micro/action/publish:
    post:
      operationId: publishGovernance
      summary: Broadcast a signed network action (governance proposal) [Public]
      tags: [Action]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Action broadcast successfully
          content:
            text/plain:
              schema:
                type: string
  /api/v1/micro/config:
    get:
      operationId: getConfig
      summary: Retrieve the active node configuration [Private]
      description: Requires Nrs or Admin role.
      tags: [System]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Configuration object
          content:
            application/json:
              schema:
                type: object
    post:
      operationId: updateConfig
      summary: Update config [Private]
      description: Requires System or Admin role.
      tags: [System]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
      responses:
        '200':
          description: Config Updated
  /api/v1/micro/nrs/owned:
    get:
      operationId: getOwnedNames
      summary: Get list of locally owned names [Private]
      description: Requires Nrs or Admin role.
      tags: [NRS]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/macro/register:
    post:
      operationId: vdfRegister
      summary: Start VDF name registration task [Private]
      description: Requires VDF or Admin role.
      tags: [VDF]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VdfRegisterRequest'
      responses:
        '200':
          description: Task started
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                  message:
                    type: string
  /api/macro/renew:
    post:
      operationId: vdfRenew
      summary: Start VDF name renewal task [Private]
      description: Requires VDF or Admin role.
      tags: [VDF]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameRenewRequest'
      responses:
        '200':
          description: Task started
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                  message:
                    type: string
  /api/macro/status/{task_id}:
    get:
      operationId: getVdfStatus
      summary: Get status of a VDF task [Private]
      description: Requires VDF or Admin role.
      tags: [VDF]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VdfTaskStatus'
    delete:
      operationId: deleteVdfTask
      summary: Delete a VDF task from memory [Private]
      description: Requires VDF or Admin role.
      tags: [VDF]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
  /api/v1/micro/gossip/subscribe/{topic}:
    get:
      operationId: gossipSubscribe
      summary: Subscribe to a Gossipsub topic via Server-Sent Events (SSE) [Public]
      tags: [Gossip]
      parameters:
        - in: path
          name: topic
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SSE Stream
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/micro/gossip/publish/{topic}:
    post:
      operationId: gossipPublish
      summary: Broadcast a payload to a Gossipsub topic [Private]
      description: Requires Gossip or Admin role.
      tags: [Gossip]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: topic
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /api/v1/micro/atlas/sync:
    post:
      operationId: syncAtlas
      summary: Trigger a synchronization of the foreign NSP bridge [Private]
      description: Requires Atlas or Admin role.
      tags: [System]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sync triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /api/v1/micro/kid/list:
    get:
      operationId: listKids
      summary: List all public identifiers for KIDs [Public]
      tags: [KID]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/v1/micro/kid/generate:
    post:
      operationId: generateKid
      summary: Generate a new KID [Private]
      description: Requires Kid or Admin role.
      tags: [KID]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: KID generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /api/v1/micro/kid/{name}:
    get:
      operationId: fetchKid
      summary: Fetch details of a specific KID [Public]
      tags: [KID]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedKid'
  /api/v1/micro/kid/{name}/rotate:
    post:
      operationId: rotateKid
      summary: Rotate the keys for a given KID [Private]
      description: Requires Kid or Admin role.
      tags: [KID]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Keys rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /api/v1/micro/kid/{name}/revoke:
    post:
      operationId: revokeKid
      summary: Revoke a given KID [Private]
      description: Requires Kid or Admin role.
      tags: [KID]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: KID revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /api/v1/micro/kid/{name}/manifest:
    get:
      operationId: fetchKidManifest
      summary: Fetch the local manifest for a specific KID [Public]
      tags: [KID]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedManifest'
    post:
      operationId: generateKidManifest
      summary: Generate and sign a capability manifest for a KID [Private]
      description: Requires Kid or Admin role.
      tags: [KID]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Manifest generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /api/v1/micro/auth/session:
    post:
      operationId: createSession
      summary: Create a new persistent session token for an application [Private]
      description: Requires Admin role.
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  id:
                    type: string
                  token:
                    type: string
  /api/v1/micro/auth/sessions:
    get:
      operationId: listSessions
      summary: List all active application session tokens [Private]
      description: Requires Admin role.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSessionsResponse'
  /api/v1/micro/auth/session/{id}:
    delete:
      operationId: revokeSession
      summary: Revoke an application session token using its ID [Private]
      description: Requires Admin role.
      tags: [Auth]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /api/v1/micro/system/shutdown:
    post:
      operationId: systemShutdown
      summary: Gracefully shut down the Kinetic daemon [Private]
