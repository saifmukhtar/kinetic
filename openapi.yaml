openapi: 3.0.3
info:
  title: Kinetic Daemon API
  version: 0.1.0
  description: The HTTP REST API exposed by the Kinetic Daemon for domain management, VDF proofs, and resolution.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: "{scheme}://{host}:{port}/api"
    description: Kinetic daemon API — configure host and port at runtime
    variables:
      scheme:
        default: http
        enum: [http, https]
        description: Transport scheme (http for local, https for remote/TLS deployments)
      host:
        default: "127.0.0.1"
        description: Daemon bind address — override per deployment
      port:
        default: "16002"
        description: Daemon API port — override per deployment
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CreateSessionRequest:
      type: object
      properties:
        app_name:
          type: string
        role:
          type: string
          enum: [admin, publish, vdf, governance, atlas]
      required:
        - app_name
        - role
    AppSession:
      type: object
      properties:
        token:
          type: string
        app_name:
          type: string
        role:
          type: string
        created_at:
          type: integer
      required:
        - token
        - app_name
        - role
        - created_at
    ListSessionsResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AppSession'
      required:
        - sessions
    PublishResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
      required:
        - status
        - message
    ConfigResponse:
      type: object
      properties:
        status:
          type: string
        mode:
          type: string
      required:
        - status
        - mode
    VdfTaskStatus:
      type: object
      properties:
        status:
          type: string
        iterations:
          type: integer
        progress:
          type: integer
        error:
          type: string
          nullable: true
      required:
        - status
        - iterations
        - progress
    NrsRecord:
      type: object
      properties:
        type:
          type: string
          enum: [A, AAAA, CNAME, TXT, PeerId, KID]
        value:
          type: string
      required:
        - type
        - value
    NrsZone:
      type: object
      properties:
        records:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/NrsRecord'
    VdfProof:
      type: object
      properties:
        proof_bytes:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 255
      required:
        - proof_bytes
    PreviousProof:
      type: object
      properties:
        salt:
          type: array
          items:
            type: integer
        kyn:
          type: integer
        drand_signature:
          type: string
        iterations:
          type: integer
        vdf_proof:
          $ref: '#/components/schemas/VdfProof'
        signature:
          type: array
          items:
            type: integer
      required:
        - salt
        - kyn
        - drand_signature
        - iterations
        - vdf_proof
        - signature
    Reveal:
      type: object
      properties:
        protocol_version:
          type: integer
          default: 2
        name:
          type: string
        payload:
          type: array
          items:
            type: integer
        salt:
          type: array
          items:
            type: integer
        kyn:
          type: integer
        drand_signature:
          type: string
        iterations:
          type: integer
        vdf_proof:
          $ref: '#/components/schemas/VdfProof'
        pubkey:
          type: array
          items:
            type: integer
        signature:
          type: array
          items:
            type: integer
        previous_proof:
          $ref: '#/components/schemas/PreviousProof'
          nullable: true
        miner_pubkey:
          type: array
          items:
            type: integer
          nullable: true
      required:
        - protocol_version
        - name
        - payload
        - salt
        - kyn
        - drand_signature
        - iterations
        - vdf_proof
        - pubkey
        - signature
    Commitment:
      type: object
      properties:
        hash:
          type: array
          items:
            type: integer
      required:
        - hash
    CommitRequest:
      type: object
      properties:
        name:
          type: string
        commitment:
          $ref: '#/components/schemas/Commitment'
      required:
        - name
        - commitment
    PublishRequest:
      type: object
      properties:
        reveal:
          $ref: '#/components/schemas/Reveal'
      required:
        - reveal
    VdfRegisterRequest:
      type: object
      properties:
        name:
          type: string
        iterations:
          type: integer
          nullable: true
      required:
        - name
    NameRenewRequest:
      type: object
      properties:
        name:
          type: string
        iterations:
          type: integer
          nullable: true
      required:
        - name
    KidDocument:
      type: object
      properties:
        doc_type:
          type: string
        kid:
          type: string
        created_at:
          type: integer
        controller_keys:
          type: array
          items:
            type: string
        manifest:
          type: object
          nullable: true
        revocation_keys:
          type: array
          items:
            type: string
        signature:
          type: string
          nullable: true
      required:
        - doc_type
        - kid
        - created_at
        - controller_keys
        - revocation_keys
    AuthorizedKid:
      type: object
      properties:
        name:
          type: string
        kid_doc:
          $ref: '#/components/schemas/KidDocument'
        owner_signature:
          type: array
          items:
            type: integer
      required:
        - name
        - kid_doc
        - owner_signature
    CapabilityManifest:
      type: object
      properties:
        doc_type:
          type: string
        kid:
          type: string
        version:
          type: integer
        valid_from:
          type: integer
        services:
          type: array
          items:
            type: object
        signature:
          type: string
          nullable: true
      required:
        - doc_type
        - kid
        - version
        - valid_from
        - services
    AuthorizedManifest:
      type: object
      properties:
        name:
          type: string
        manifest:
          $ref: '#/components/schemas/CapabilityManifest'
        owner_signature:
          type: array
          items:
            type: integer
      required:
        - name
        - manifest
        - owner_signature

paths:
  /health:
    get:
      operationId: getHealth
      summary: Get daemon health status
      tags: [Public]
      responses:
        '200':
          description: Health status object
          content:
            application/json:
              schema:
                type: object
  /peer_id:
    get:
      operationId: getPeerId
      summary: Get local peer ID
      tags: [Public]
      responses:
        '200':
          description: Peer ID string
          content:
            text/plain:
              schema:
                type: string
  /network-status:
    get:
      operationId: getNetworkStatus
      summary: Get network status
      tags: [Public]
      responses:
        '200':
          description: Network status object
          content:
            application/json:
              schema:
                type: object
  /governance:
    get:
      operationId: getGovernance
      summary: Get current governance state
      tags: [Public]
      responses:
        '200':
          description: Governance state binary data
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /time:
    get:
      operationId: getTime
      summary: Get verified Kinetic network time
      tags: [Public]
      responses:
        '200':
          description: Kinetic time object
          content:
            application/json:
              schema:
                type: object
  /resolve/{name}:
    get:
      operationId: resolveName
      summary: Resolve a Kinetic name
      tags: [Public]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found Reveal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reveal'
  /resolve-kid/{did}:
    get:
      operationId: resolveKid
      summary: Resolve a KID
      tags: [Public]
      parameters:
        - in: path
          name: did
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found KID and Manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  kid_document:
                    $ref: '#/components/schemas/KidDocument'
                  manifest_document:
                    $ref: '#/components/schemas/CapabilityManifest'
  /names/reserved:
    get:
      operationId: getReservedNames
      summary: Get the list of all reserved names for the current network
      tags: [Public]
      responses:
        '200':
          description: List of reserved names with their active local status
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    active:
                      type: boolean
  /zone/local/{name}:
    get:
      operationId: getLocalReservedZone
      summary: Get local NRS override for a reserved name
      tags: [Public]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found Zone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NrsZone'
    post:
      operationId: saveLocalReservedZone
      summary: Save local NRS override for a reserved name
      description: Requires Publish or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NrsZone'
      responses:
        '200':
          description: Saved
    delete:
      operationId: deleteLocalReservedZone
      summary: Delete local NRS override for a reserved name
      description: Requires Publish or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
  /zone/{name}:
    get:
      operationId: getZone
      summary: Get local NRS zone file
      tags: [Public]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found Zone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NrsZone'
    post:
      operationId: saveZone
      summary: Save local NRS zone file
      description: Requires Publish or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NrsZone'
      responses:
        '200':
          description: Saved
  /zone/{name}/publish:
    post:
      operationId: publishZone
      summary: Cryptographically sign and publish local zone to DHT
      description: Requires Publish or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published
  /commit:
    post:
      operationId: commitName
      summary: Commit a name hash to DHT
      description: Requires Publish or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: Committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /publish:
    post:
      operationId: publishName
      summary: Publish a name reveal to DHT
      description: Requires Publish or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /publish-kid:
    post:
      operationId: publishKid
      summary: Publish a KID to DHT
      description: Requires Publish or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizedKid'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /publish-manifest:
    post:
      operationId: publishManifest
      summary: Publish a Capability Manifest to DHT
      description: Requires Publish or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizedManifest'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /publish-governance:
    post:
      operationId: publishGovernance
      summary: Publish a Governance action to DHT
      description: Requires Governance or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /config:
    get:
      operationId: getConfig
      summary: Get config
      description: Requires Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Config Object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
    post:
      operationId: updateConfig
      summary: Update config
      description: Requires Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
      responses:
        '200':
          description: Config Updated
  /owned-names:
    get:
      operationId: getOwnedNames
      summary: Get list of locally owned names
      description: Requires Publish or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /vdf/register:
    post:
      operationId: vdfRegister
      summary: Start VDF name registration task
      description: Requires VDF or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VdfRegisterRequest'
      responses:
        '200':
          description: Task started
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                  message:
                    type: string
  /vdf/renew:
    post:
      operationId: vdfRenew
      summary: Start VDF name renewal task
      description: Requires VDF or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameRenewRequest'
      responses:
        '200':
          description: Task started
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                  message:
                    type: string
  /vdf/status/{task_id}:
    get:
      operationId: getVdfStatus
      summary: Get status of a VDF task
      description: Requires VDF or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VdfTaskStatus'
    delete:
      operationId: deleteVdfTask
      summary: Delete a VDF task from memory
      description: Requires VDF or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
  /gossip/subscribe/{topic}:
    get:
      operationId: gossipSubscribe
      summary: Subscribe to a Gossipsub topic via Server-Sent Events (SSE)
      tags: [Public]
      parameters:
        - in: path
          name: topic
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SSE Stream
          content:
            text/event-stream:
              schema:
                type: string
  /gossip/publish/{topic}:
    post:
      operationId: gossipPublish
      summary: Broadcast a payload to a Gossipsub topic
      description: Requires Publish or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: topic
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /internal/atlas/sync:
    post:
      operationId: syncAtlas
      summary: Trigger a synchronization of the foreign NSP bridge
      description: Requires Atlas or Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sync triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /kid:
    get:
      operationId: listKids
      summary: List all public identifiers for local identities
      tags: [Public]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
    post:
      operationId: generateKid
      summary: Generate a new local identity
      description: Requires Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Identity generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /kid/{name}:
    get:
      operationId: fetchKid
      summary: Fetch details of a specific local identity
      tags: [Public]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedKid'
  /kid/{name}/rotate:
    post:
      operationId: rotateKid
      summary: Rotate the keys for a given local identity
      description: Requires Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Keys rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /kid/{name}/revoke:
    post:
      operationId: revokeKid
      summary: Revoke a given local identity
      description: Requires Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Identity revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /kid/{name}/manifest:
    get:
      operationId: fetchKidManifest
      summary: Fetch the local manifest for a specific identity
      tags: [Public]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedManifest'
    post:
      operationId: generateKidManifest
      summary: Generate and sign a capability manifest for an identity
      description: Requires Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Manifest generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /auth/session:
    post:
      operationId: createSession
      summary: Create a new persistent session token for an application
      description: Requires Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  token:
                    type: string
  /auth/sessions:
    get:
      operationId: listSessions
      summary: List all active application session tokens
      description: Requires Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSessionsResponse'
  /auth/session/{token}:
    delete:
      operationId: revokeSession
      summary: Revoke an application session token
      description: Requires Admin role.
      tags: [Private]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /system/shutdown:
    post:
      operationId: systemShutdown
      summary: Gracefully shut down the Kinetic daemon
      description: Requires Admin role. Safely flushes the database and stops the node.
      tags: [System]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Shutdown initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /system/restart:
    post:
      operationId: systemRestart
      summary: Restart the Kinetic daemon
      description: Requires Admin role. Attempts to restart via native service manager.
      tags: [System]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Restart initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
  /network/peers:
    get:
      operationId: getNetworkPeers
      summary: Retrieve the list of connected Peer IDs
      tags: [Public]
      responses:
        '200':
          description: List of connected Peer IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /gossip/topics:
    get:
      operationId: getGossipTopics
      summary: Retrieve a list of active Gossipsub topics
      tags: [Public]
      responses:
        '200':
          description: List of active Gossipsub topics
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /network/bootstrap:
    post:
      operationId: triggerNetworkBootstrap
      summary: Manually trigger a Kademlia network bootstrap
      tags: [System]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bootstrap initiated
