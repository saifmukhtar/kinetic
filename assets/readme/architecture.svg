<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%">
  <!-- Background -->
  <rect width="1200" height="500" fill="#0A0A0A" rx="12"/>
  
  <defs>
    <pattern id="dot-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4F5B66" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00E5FF" />
    </marker>
  </defs>
  <rect width="1200" height="500" fill="url(#dot-grid)" rx="12"/>

  <text x="600" y="60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Transparent Split-DNS Architecture</text>

  <!-- Browser Node -->
  <g transform="translate(100, 200)">
    <rect width="200" height="100" rx="8" fill="#141414" stroke="#4F5B66" stroke-width="2"/>
    <text x="100" y="45" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#FFF" text-anchor="middle">Web Browser</text>
    <text x="100" y="75" font-family="monospace" font-size="14" fill="#00E5FF" text-anchor="middle">example.kin</text>
  </g>

  <!-- Kinetic Daemon -->
  <g transform="translate(450, 150)">
    <rect width="280" height="200" rx="12" fill="#1A1A1A" stroke="#00E5FF" stroke-width="2"/>
    <text x="140" y="50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#FFF" text-anchor="middle">Kinetic Daemon</text>
    <rect x="40" y="80" width="200" height="40" rx="6" fill="#111" stroke="#333"/>
    <text x="140" y="105" font-family="monospace" font-size="14" fill="#B400FF" text-anchor="middle">Split-DNS Engine</text>
    <rect x="40" y="130" width="200" height="40" rx="6" fill="#111" stroke="#333"/>
    <text x="140" y="155" font-family="monospace" font-size="14" fill="#B400FF" text-anchor="middle">Kademlia DHT Node</text>
  </g>

  <!-- P2P Network -->
  <g transform="translate(850, 80)">
    <rect width="250" height="120" rx="8" fill="#141414" stroke="#4F5B66" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="125" y="45" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#FFF" text-anchor="middle">Kinetic DHT (P2P)</text>
    <text x="125" y="75" font-family="monospace" font-size="14" fill="#00E5FF" text-anchor="middle">Resolves .kin proofs</text>
    <text x="125" y="100" font-family="monospace" font-size="14" fill="#4F5B66" text-anchor="middle">VDF Verification</text>
  </g>

  <!-- Normal Internet -->
  <g transform="translate(850, 300)">
    <rect width="250" height="120" rx="8" fill="#141414" stroke="#4F5B66" stroke-width="2"/>
    <text x="125" y="55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#FFF" text-anchor="middle">Normal Internet</text>
    <text x="125" y="85" font-family="monospace" font-size="14" fill="#4F5B66" text-anchor="middle">Pass-through (1.1.1.1)</text>
  </g>

  <!-- Arrows -->
  <path d="M 300 250 L 440 250" fill="none" stroke="#00E5FF" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  
  <path d="M 730 200 C 780 200, 800 140, 840 140" fill="none" stroke="#00E5FF" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  <text x="785" y="155" font-family="monospace" font-size="14" fill="#00E5FF" text-anchor="middle">.kin queries</text>

  <path d="M 730 300 C 780 300, 800 360, 840 360" fill="none" stroke="#4F5B66" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="785" y="355" font-family="monospace" font-size="14" fill="#4F5B66" text-anchor="middle">All other traffic</text>

</svg>
