[package]
name = "kinetic-kid"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Kinetic Identity Document (KID) implementation for the Kinetic Network."
keywords = ["kinetic", "identity", "kid", "crypto"]
categories = ["cryptography", "authentication"]

[features]
simulation = []

[dependencies]
# --- Workspace & Internal Crates ---
kinetic-primitives = { path = "../kinetic-primitives" }

# --- External Crates ---
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
proptest = "1.5.0"
[build-dependencies]
serde_json = "1.0"
