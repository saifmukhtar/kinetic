[package]
name = "kinetic-local"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
kinetic-core = { version = "0.2.0", path = "../kinetic-core" }
kinetic-primitives = { path = "../kinetic-primitives" }
aes-gcm = "0.10.3"
pbkdf2 = "0.13.0"
sha2 = "0.11.0"
zeroize = { version = "1", features = ["zeroize_derive"] }
bip39 = "2.2.2"
tempfile = "3.10.1"
lazy_static = "1.4.0"
bincode = "1.3.3"
dirs = "5.0.1"
toml = "0.8.19"
tracing = "0.1.40"
serde_json = "1.0"
hex = "0.4.3"
base64 = "0.23.1"
serde = { version = "1.0", features = ["derive"] }
kinetic-kid = { version = "0.2.0", path = "../kinetic-kid" }
kinetic-types = { version = "0.2.0", path = "../kinetic-types" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "signal"] }
