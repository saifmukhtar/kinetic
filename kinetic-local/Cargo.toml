[package]
name = "kinetic-local"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

readme = "README.md"
description = "Local node management, OS integration, and secure credential storage for the Kinetic Network."
keywords = ["kinetic", "node", "storage", "os"]
categories = ["os", "filesystem"]

[dependencies]
# --- Workspace & Internal Crates ---
kinetic-core = { version = "0.2.0", path = "../kinetic-core" }
kinetic-kid = { version = "0.2.0", path = "../kinetic-kid" }
kinetic-primitives = { path = "../kinetic-primitives" }
kinetic-types = { version = "0.2.0", path = "../kinetic-types" }

# --- Workspace Inherited ---
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "signal"] }
tracing.workspace = true

# --- External Crates ---
base64 = "0.22"
bincode = "1.3.3"
bip39 = "2.2.2"
dirs = "5.0.1"
hex = "0.4.3"
lazy_static = "1.4.0"
pbkdf2 = "0.13.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tempfile = "3.10.1"
toml = "0.8.19"
zeroize = { version = "1", features = ["zeroize_derive"] }
