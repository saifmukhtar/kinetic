[workspace]
members = [
    "kinetic-action",
    "kinetic-cli",
    "kinetic-core",
    "kinetic-daemon",
    "kinetic-host",
    "kinetic-kid", "kinetic-kyn",
    "kinetic-local",
    "kinetic-network",
    "kinetic-node",
    "kinetic-nrs",
    "kinetic-pac",
    "kinetic-primitives",
    "kinetic-rpc",
    "kinetic-storage",
    "kinetic-test",
    "kinetic-types",
    "kinetic-vdf",
    "kinetic-verify",
]
exclude = [
    "axum_test",
    "kinetic-core/fuzz",
    "kinetic-daemon/fuzz",
    "kinetic-kid/fuzz",
    "kinetic-network/fuzz",
    "kinetic-nrs/fuzz",
    "kinetic-storage/fuzz",
    "kinetic-vdf/fuzz",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Saif Mukhtar <saifmukhtar20@gmail.com>"]
repository = "https://github.com/saifmukhtar/kinetic"
homepage = "https://github.com/saifmukhtar/kinetic"

[workspace.dependencies]
anyhow = "1.0.104"
arbitrary = "1.4.2"
argon2 = "0.6.0"
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
# bincode is discontinued (social drama, zero security vulnerabilities). 
# We intentionally lock at 1.3.3 rather than migrate. A tribute to a legendary, rock-solid crate.
bincode = "1.3.3"
bip39 = "3.0.0"
bytes = "1.12.1"
clap = "4.6.7"
colored = "3.1.1"
comfy-table = "8.0.1"
criterion = "0.8.2"
data-encoding = "2.11.1"
dirs = "7.0.0"
beacon-verify = { package = "drand-verify", version = "0.6.2" }
ed25519-dalek = "3.0.0"
futures = "0.3.34"
futures-timer = "3.0.3"
futures-util = "0.3.34"
getrandom = "0.4.3"
gloo-timers = "0.3.0"
hex = "0.4.3"
hickory-client = "0.24.4"
hickory-proto = "0.24.4"
hickory-resolver = "0.24.4"
hickory-server = "0.24.4"
http = "1.5.0"
http-body-util = "0.1.5"
httptest = "0.16.4"
hyper = "1.11.1"
hyper-util = "0.1.20"
indicatif = "0.18.6"
keyring = "3.6.2"
lazy_static = "1.5.0"
libfuzzer-sys = "0.4.13"
libp2p = { version = "0.57.0", default-features = false }
libp2p-identity = "0.3.0"
libp2p-stream = "0.5.0-alpha"
libp2p-webrtc = "0.10.0-alpha"
lru = "0.18.5"
ml-dsa = "0.1.1"
mockito = "1.7.2"
moka = "0.12"
num-bigint = "0.4.8"
num-prime = "0.5.0"
num-traits = "0.2.19"
pbkdf2 = "0.13.0"
percent-encoding = "2.3.2"
privdrop = "0.5.7"
proptest = "1.11.0"
rand = "0.10.3"
rand_core = "0.10.1"
rcgen = "0.13.2"
redb = "4.3.0"
reqwest = "0.13.5"
rpassword = "7.5.4"
rustc-hash = "2.1.3"
rustls = "0.23.45"
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.15.1"
serde = "1.0.229"
serde_bytes = "0.11.19"
serde_jcs = "0.2.0"
serde_json = "1.0.151"
service-manager = "0.11.0"
sha2 = "0.11.0"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = "0.26.4"
tokio-stream = "0.1.19"
toml = "1.1.6"
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
turmoil = "0.7.2"
uuid = "1.26.1"
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"
web-sys = "0.3"
web-time = "1.1.0"
zeroize = "1.9.0"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
