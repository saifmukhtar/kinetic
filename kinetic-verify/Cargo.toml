[package]
name = "kinetic-verify"
version = "0.1.2"
edition.workspace = true
license.workspace = true
description = "Lightweight, no_std compatible cryptographic verification for the Kinetic Network"
repository = "https://github.com/kinetic-network/kinetic"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ml-dsa = "0.1.1"
thiserror.workspace = true
kinetic-types = { version = "0.1.1", path = "../kinetic-types" }
