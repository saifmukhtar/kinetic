[package]
name = "kinetic-dns"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
simulation = ["kinetic-core/simulation"]

[dependencies]
kinetic-core = { version = "0.1.0", path = "../kinetic-core" }
hickory-server = "0.24"
async-trait = "0.1"
tokio = { workspace = true, features = ["sync"] }
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
hickory-proto = "0.24"
kinetic-network = { version = "0.1.0", path = "../kinetic-network" }
hickory-resolver = { version = "0.24.4", features = ["dns-over-https-rustls", "webpki-roots", "system-config"] }
serde_json = "1.0.150"
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.13.4", features = ["json"] }
tracing-subscriber.workspace = true
clap = { version = "4.5", features = ["derive"] }
service-manager = "0.11"
dirs = "5.0"
privdrop = "0.5.6"
base64 = "0.22"
[dev-dependencies]
axum = "0.7"
proptest = "1.4"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
ml-dsa = "0.1.1"
