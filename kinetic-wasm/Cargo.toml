[package]
name = "kinetic-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.42"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "console",
  "Window",
  "Document",
  "HtmlElement",
  "Node",
  "Text",
] }
console_error_panic_hook = "0.1"

# Kinetic internal crates
kinetic-core = { path = "../kinetic-core" }
kinetic-network = { path = "../kinetic-network" }
kinetic-storage = { path = "../kinetic-storage" }

# External crates
libp2p = { version = "0.53.2", default-features = false }
tokio = { version = "1.38.0", default-features = false, features = ["sync"] }
serde_json = "1.0.150"
serde-wasm-bindgen = "0.6.5"

[dev-dependencies]
wasm-bindgen-test = "0.3"
