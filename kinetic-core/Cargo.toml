[package]
name = "kinetic-core"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
description = "Core daemon primitives, VDF management, and network utilities for the Kinetic Network."
repository = "https://github.com/kinetic-network/kinetic"
readme = "../README.md"
keywords = ["kinetic", "p2p", "vdf", "post-quantum"]
categories = ["cryptography", "network-programming"]

[features]
simulation = []

[dependencies]
kinetic-verify = { version = "0.2.0", path = "../kinetic-verify" }
thiserror.workspace = true
anyhow.workspace = true
sha2 = "0.11.0"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing.workspace = true
toml = "1.1.2"
ed25519-dalek = { version = "2.2.0", features = ["serde"] }
getrandom = "0.2.14"
bincode = "1.3.3"
hex = "0.4.3"
tempfile = "3.27.0"
futures-util = "0.3.32"
lazy_static = "1.5.0"
web-time = { version = "1.1.0", features = ["serde"] }
libp2p-identity = { version = "0.2.14", features = ["peerid"] }
bip39 = "2.2.2"
pbkdf2 = "0.13.0"
drand-verify = "0.6.2"
kinetic-kid = { version = "0.2.0", path = "../kinetic-kid" }
bytes = "1.6.0"
zeroize = { version = "1", features = ["zeroize_derive"] }
rand_chacha = "0.10.0"
rand_core = "0.10.1"
ml-dsa = "0.1.1"
aes-gcm = "0.10.3"
kinetic-types = { version = "0.2.0", path = "../kinetic-types" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = "6.0.0"
dirs = "6.0.0"
hickory-resolver = "0.24.4"

tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.14", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
gloo-timers = { version = "0.3.0", features = ["futures"] }

[dev-dependencies]
criterion = "0.8.2"
mockito = "1.7.2"
proptest = "1.5.0"

[[bench]]
name = "crypto_bench"
harness = false

[[bench]]
name = "names_bench"
harness = false


[build-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
