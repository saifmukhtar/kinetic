[package]
name = "kinetic-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
simulation = []

[dependencies]
thiserror.workspace = true
anyhow.workspace = true
sha2 = "0.10"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
tokio = { workspace = true, features = ["sync", "rt"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing.workspace = true
toml = "1.1.2"
directories = "6.0.0"
ed25519-dalek = { version = "2.2.0", features = ["serde"] }
getrandom = "0.4.3"
dirs = "6.0.0"
hickory-resolver = "0.24.4"
bincode = "1.3.3"
hex = "0.4.3"
self-replace = "1.5.0"
tempfile = "3.27.0"
futures-util = "0.3.32"
lazy_static = "1.5.0"

[dev-dependencies]
criterion = "0.8.2"
mockito = "1.7.2"

[[bench]]
name = "crypto_bench"
harness = false

[[bin]]
name = "bin_test"
path = "src/bin_test.rs"
