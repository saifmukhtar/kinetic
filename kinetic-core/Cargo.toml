[package]
name = "kinetic-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
simulation = []

[dependencies]
thiserror.workspace = true
anyhow.workspace = true
sha2 = "0.11.0"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing.workspace = true
toml = "1.1.2"
ed25519-dalek = { version = "2.2.0", features = ["serde"] }
getrandom = "0.2.14"
bincode = "1.3.3"
hex = "0.4.3"
tempfile = "3.27.0"
futures-util = "0.3.32"
lazy_static = "1.5.0"
web-time = { version = "1.1.0", features = ["serde"] }
libp2p-identity = { version = "0.2.14", features = ["peerid"] }
bip39 = "2.2.2"
pbkdf2 = "0.13.0"
drand-verify = "0.6.2"
kinetic-kid = { version = "0.1.0", path = "../kinetic-kid" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = "6.0.0"
dirs = "6.0.0"
hickory-resolver = "0.24.4"
self-replace = "1.5.0"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.14", features = ["js"] }

[dev-dependencies]
criterion = "0.8.2"
mockito = "1.7.2"

[[bench]]
name = "crypto_bench"
harness = false

[[bin]]
name = "bin_test"
path = "src/bin_test.rs"
