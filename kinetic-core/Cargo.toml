[package]
name = "kinetic-core"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
description = "Core daemon primitives, VDF management, and network utilities for the Kinetic Network."
repository = "https://github.com/saifmukhtar/kinetic"
readme = "../README.md"
keywords = ["kinetic", "p2p", "vdf", "post-quantum"]
categories = ["cryptography", "network-programming"]

[features]
simulation = []

[dependencies]
# --- Workspace & Internal Crates ---
kinetic-kid = { version = "0.2.0", path = "../kinetic-kid" }
kinetic-primitives = { version = "0.2.0", path = "../kinetic-primitives" }
kinetic-types = { version = "0.2.0", path = "../kinetic-types" }
kinetic-verify = { version = "0.2.0", path = "../kinetic-verify" }

# --- Workspace Inherited ---
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

# --- External Crates ---
async-trait = "0.1"
base64 = "0.22"
bincode = "1.3.3"
bytes = "1.6.0"
drand-verify = "0.6.2"
futures-util = "0.3.32"
getrandom = "0.2.14"
hex = "0.4.3"
libp2p-identity = { version = "0.2.14", features = ["peerid"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
zeroize = { version = "1", features = ["zeroize_derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.14", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
criterion = "0.8.2"
ed25519-dalek = { version = "2.2.0", features = ["serde"] }
mockito = "1.7.2"
proptest = "1.5.0"
sha2 = "0.11.0"
web-time = "1.1.0"

[build-dependencies]
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"

[[bench]]
name = "crypto_bench"
harness = false

[[bench]]
name = "names_bench"
harness = false
