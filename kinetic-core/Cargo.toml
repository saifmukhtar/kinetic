[package]
name = "kinetic-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
build = "build.rs"
readme = "README.md"
description = "Core daemon primitives, VDF management, and network utilities for the Kinetic Network."
keywords = ["kinetic", "p2p", "vdf", "post-quantum"]
categories = ["cryptography", "network-programming"]

[features]
simulation = []

[dependencies]
# --- Workspace & Internal Crates ---
kinetic-kid = { path = "../kinetic-kid" }
kinetic-primitives = { path = "../kinetic-primitives" }
kinetic-types = { path = "../kinetic-types" }
kinetic-verify = { path = "../kinetic-verify" }

# --- Workspace Inherited ---
anyhow.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true

# --- External Crates ---
bytes.workspace = true
drand-verify.workspace = true
hex.workspace = true
libp2p-identity = { workspace = true, features = ["peerid"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.14", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
# --- External Crates ---
criterion.workspace = true
ed25519-dalek = { workspace = true, features = ["serde"] }
getrandom.workspace = true
proptest.workspace = true
sha2.workspace = true

[build-dependencies]
# --- External Crates ---
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true

[[bench]]
name = "crypto_bench"
harness = false

[[bench]]
name = "names_bench"
harness = false
