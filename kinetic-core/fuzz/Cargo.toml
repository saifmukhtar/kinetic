[package]
name = "kinetic-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.kinetic-core]
path = ".."

[dependencies.bincode]
version = "1.3.3"

[dependencies.serde_json]
version = "1.0"

[[bin]]
name = "fuzz_json_deserialize"
path = "fuzz_targets/fuzz_json_deserialize.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "fuzz_core_bincode"
path = "fuzz_targets/fuzz_core_bincode.rs"
test = false
doc = false
bench = false
