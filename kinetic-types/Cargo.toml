[package]
name = "kinetic-types"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Core governance primitives and post-quantum (ML-DSA-65) serialization for the Kinetic network."
repository = "https://github.com/saifmukhtar/kinetic"
readme = "README.md"
keywords = ["kinetic", "governance", "ml-dsa", "post-quantum"]
categories = ["cryptography", "data-structures"]

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
thiserror = "1.0"
bytes = "1.4"
serde_bytes = "0.11"
kinetic-kid = { version = "0.2.0", path = "../kinetic-kid" }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1.0"
proptest = "1.0"
rand = "0.8"
