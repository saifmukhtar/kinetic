[package]
name = "kinetic-types"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Core governance primitives and post-quantum (ML-DSA-65) serialization for the Kinetic network."
keywords = ["kinetic", "governance", "ml-dsa", "post-quantum"]
categories = ["cryptography", "data-structures"]

[dependencies]
# --- Workspace & Internal Crates ---
kinetic-kid = { version = "0.2.0", path = "../kinetic-kid" }
kinetic-primitives = { path = "../kinetic-primitives" }
thiserror.workspace = true

# --- External Crates ---
bytes = "1.4"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_bytes = "0.11"

[dev-dependencies]
proptest = "1.0"
rand = "0.8"
serde_json = "1.0"
