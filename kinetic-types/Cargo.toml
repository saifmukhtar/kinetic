[package]
name = "kinetic-types"
version = "0.1.1"
edition.workspace = true
license.workspace = true
authors = ["Saif Mukhtar"]
description = "Core governance primitives and post-quantum (ML-DSA-65) serialization for the Kinetic network."
repository = "https://github.com/saifmukhtar/kinetic"
readme = "README.md"
keywords = ["kinetic", "governance", "ml-dsa", "post-quantum"]
categories = ["cryptography", "data-structures"]

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
ml-dsa = "0.1.1"
thiserror = "1.0"
bytes = "1.4"
serde_bytes = "0.11"
kinetic-kid = { version = "0.1.0", path = "../kinetic-kid" }

[dev-dependencies]
serde_json = "1.0"
