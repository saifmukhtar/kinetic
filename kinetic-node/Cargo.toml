[package]
name = "kinetic-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The background full-node and bootstrap seed daemon for the Kinetic Network."
readme = "README.md"

[features]
simulation = ["kinetic-core/simulation"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap = { workspace = true, features = ["derive"] }
kinetic-core.workspace = true
kinetic-local.workspace = true
kinetic-kyn.workspace = true
kinetic-network.workspace = true
kinetic-storage.workspace = true
kinetic-types.workspace = true
kinetic-vdf.workspace = true
libp2p = { workspace = true, features = ["ed25519", "tokio", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
service-manager.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
http-body-util.workspace = true
proptest.workspace = true
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
kinetic-primitives.workspace = true

[lints]
workspace = true
