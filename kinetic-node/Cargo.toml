[package]
name = "kinetic-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The background full-node and bootstrap seed daemon for the Kinetic Network."
readme = "README.md"

[features]
simulation = ["kinetic-core/simulation"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap = { workspace = true, features = ["derive"] }
kinetic-core = { path = "../kinetic-core" }
kinetic-local = { path = "../kinetic-local" }
kinetic-network = { path = "../kinetic-network" }
kinetic-storage = { path = "../kinetic-storage" }
kinetic-types = { path = "../kinetic-types" }
kinetic-vdf = { path = "../kinetic-vdf" }
libp2p = { workspace = true, features = ["ed25519", "tokio", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
service-manager.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util.workspace = true
proptest.workspace = true
tempfile.workspace = true
tower = { version = "0.5.3", features = ["util"] }
