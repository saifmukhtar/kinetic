name: Build and Release Binaries

on:
  release:
    types: [created]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: kinetic-daemon
            asset_name: kinetic-daemon-linux
            cli_artifact: kinetic-cli
            cli_asset: kinetic-cli-linux
            node_artifact: kinetic-node
            node_asset: kinetic-node-linux
            host_artifact: kinetic-host
            host_asset: kinetic-host-linux
            keygen_artifact: kinetic-keygen
            keygen_asset: kinetic-keygen-linux
            dns_artifact: kinetic-dns-server
            dns_asset: kinetic-dns-server-linux
          - os: macos-latest
            artifact_name: kinetic-daemon
            asset_name: kinetic-daemon-macos
            cli_artifact: kinetic-cli
            cli_asset: kinetic-cli-macos
            node_artifact: kinetic-node
            node_asset: kinetic-node-macos
            host_artifact: kinetic-host
            host_asset: kinetic-host-macos
            keygen_artifact: kinetic-keygen
            keygen_asset: kinetic-keygen-macos
            dns_artifact: kinetic-dns-server
            dns_asset: kinetic-dns-server-macos
          - os: windows-latest
            artifact_name: kinetic-daemon.exe
            asset_name: kinetic-daemon-windows.exe
            cli_artifact: kinetic-cli.exe
            cli_asset: kinetic-cli-windows.exe
            node_artifact: kinetic-node.exe
            node_asset: kinetic-node-windows.exe
            host_artifact: kinetic-host.exe
            host_asset: kinetic-host-windows.exe
            keygen_artifact: kinetic-keygen.exe
            keygen_asset: kinetic-keygen-windows.exe
            dns_artifact: kinetic-dns-server.exe
            dns_asset: kinetic-dns-server-windows.exe

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install MPIR (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd kinetic-vdf/chiavdf
        git clone https://github.com/Chia-Network/mpir_gc_x64.git

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y libgmp-dev clang libclang-dev

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install gmp

    - name: Build Kinetic Daemon (Release)
      run: cargo build --release -p kinetic-daemon

    - name: Build Kinetic CLI (Release)
      run: cargo build --release -p kinetic-cli

    - name: Build Kinetic Node (Release)
      run: cargo build --release -p kinetic-node

    - name: Build Kinetic Host (Release)
      run: cargo build --release -p kinetic-host

    - name: Build Kinetic Keygen (Release)
      run: cargo build --release -p kinetic-keygen

    - name: Build Kinetic DNS Server (Release)
      run: cargo build --release -p kinetic-dns --bin kinetic-dns-server

    - name: Rename Binaries for Release
      shell: bash
      run: |
        cp target/release/${{ matrix.artifact_name }} target/release/${{ matrix.asset_name }}
        cp target/release/${{ matrix.cli_artifact }} target/release/${{ matrix.cli_asset }}
        cp target/release/${{ matrix.node_artifact }} target/release/${{ matrix.node_asset }}
        cp target/release/${{ matrix.host_artifact }} target/release/${{ matrix.host_asset }}
        cp target/release/${{ matrix.keygen_artifact }} target/release/${{ matrix.keygen_asset }}
        cp target/release/${{ matrix.dns_artifact }} target/release/${{ matrix.dns_asset }}

    - name: Upload Binary to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          target/release/${{ matrix.asset_name }}
          target/release/${{ matrix.cli_asset }}
          target/release/${{ matrix.node_asset }}
          target/release/${{ matrix.host_asset }}
          target/release/${{ matrix.keygen_asset }}
          target/release/${{ matrix.dns_asset }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
