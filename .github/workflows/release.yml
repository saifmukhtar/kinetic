name: Build and Release Binaries

on:
  release:
    types: [created]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build_linux_gnu:
    name: Build Linux GNU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev clang libclang-dev
      - name: Build Workspace (Release)
        run: cargo build --release --workspace
      - name: Package Artifacts
        run: |
          NSP=$(jq -r '.network.nsp' network.json)
          mkdir -p artifacts minimal_pkg full_pkg node_host_pkg
          
          cp target/release/kinetic-daemon minimal_pkg/${NSP}-daemon
          cp target/release/kinetic-cli minimal_pkg/${NSP}
          cp target/release/kinetic-pac minimal_pkg/${NSP}-pac
          tar -czf artifacts/${NSP}-minimal-linux-gnu.tar.gz -C minimal_pkg .
          
          cp target/release/kinetic-daemon full_pkg/${NSP}-daemon
          cp target/release/kinetic-cli full_pkg/${NSP}
          cp target/release/kinetic-nrs full_pkg/${NSP}-nrs
          cp target/release/kinetic-pac full_pkg/${NSP}-pac
          tar -czf artifacts/${NSP}-full-linux-gnu.tar.gz -C full_pkg .
          
          cp target/release/kinetic-cli node_host_pkg/${NSP}
          cp target/release/kinetic-node node_host_pkg/${NSP}-node
          cp target/release/kinetic-host node_host_pkg/${NSP}-host
          tar -czf artifacts/${NSP}-node-host-linux-gnu.tar.gz -C node_host_pkg .
          
          if command -v sha256sum >/dev/null 2>&1; then
            cd artifacts && sha256sum * > checksums-linux-gnu.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-gnu-binaries
          path: artifacts/*

  build_linux_musl:
    name: Build Linux Musl (Alpine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install musl C++ compiler
        run: |
          wget -q https://musl.cc/x86_64-linux-musl-cross.tgz
          tar xzf x86_64-linux-musl-cross.tgz
          echo "$PWD/x86_64-linux-musl-cross/bin" >> $GITHUB_PATH
          echo "CC=x86_64-linux-musl-gcc" >> $GITHUB_ENV
          echo "CXX=x86_64-linux-musl-g++" >> $GITHUB_ENV
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build Workspace (Release)
        run: cargo build --release --workspace --target x86_64-unknown-linux-musl
      - name: Package Artifacts
        run: |
          NSP=$(jq -r '.network.nsp' network.json)
          mkdir -p artifacts minimal_pkg full_pkg node_host_pkg
          
          cp target/x86_64-unknown-linux-musl/release/kinetic-daemon minimal_pkg/${NSP}-daemon
          cp target/x86_64-unknown-linux-musl/release/kinetic-cli minimal_pkg/${NSP}
          cp target/x86_64-unknown-linux-musl/release/kinetic-pac minimal_pkg/${NSP}-pac
          tar -czf artifacts/${NSP}-minimal-linux-musl.tar.gz -C minimal_pkg .
          
          cp target/x86_64-unknown-linux-musl/release/kinetic-daemon full_pkg/${NSP}-daemon
          cp target/x86_64-unknown-linux-musl/release/kinetic-cli full_pkg/${NSP}
          cp target/x86_64-unknown-linux-musl/release/kinetic-nrs full_pkg/${NSP}-nrs
          cp target/x86_64-unknown-linux-musl/release/kinetic-pac full_pkg/${NSP}-pac
          tar -czf artifacts/${NSP}-full-linux-musl.tar.gz -C full_pkg .
          
          cp target/x86_64-unknown-linux-musl/release/kinetic-cli node_host_pkg/${NSP}
          cp target/x86_64-unknown-linux-musl/release/kinetic-node node_host_pkg/${NSP}-node
          cp target/x86_64-unknown-linux-musl/release/kinetic-host node_host_pkg/${NSP}-host
          tar -czf artifacts/${NSP}-node-host-linux-musl.tar.gz -C node_host_pkg .
          
          if command -v sha256sum >/dev/null 2>&1; then
            cd artifacts && sha256sum * > checksums-linux-musl.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-musl-binaries
          path: artifacts/*

  build_macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: brew install gmp
      - name: Build Workspace (Release)
        run: cargo build --release --workspace
      - name: Package Artifacts
        run: |
          NSP=$(jq -r '.network.nsp' network.json)
          mkdir -p artifacts minimal_pkg full_pkg node_host_pkg
          
          cp target/release/kinetic-daemon minimal_pkg/${NSP}-daemon
          cp target/release/kinetic-cli minimal_pkg/${NSP}
          cp target/release/kinetic-pac minimal_pkg/${NSP}-pac
          tar -czf artifacts/${NSP}-minimal-macos.tar.gz -C minimal_pkg .
          
          cp target/release/kinetic-daemon full_pkg/${NSP}-daemon
          cp target/release/kinetic-cli full_pkg/${NSP}
          cp target/release/kinetic-nrs full_pkg/${NSP}-nrs
          cp target/release/kinetic-pac full_pkg/${NSP}-pac
          tar -czf artifacts/${NSP}-full-macos.tar.gz -C full_pkg .
          
          cp target/release/kinetic-cli node_host_pkg/${NSP}
          cp target/release/kinetic-node node_host_pkg/${NSP}-node
          cp target/release/kinetic-host node_host_pkg/${NSP}-host
          tar -czf artifacts/${NSP}-node-host-macos.tar.gz -C node_host_pkg .
          
          if command -v sha256sum >/dev/null 2>&1; then
            cd artifacts && sha256sum * > checksums-macos.txt
          else
            cd artifacts && shasum -a 256 * > checksums-macos.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: artifacts/*

  build_windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Enable Longpaths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install MPIR
        run: |
          cd kinetic-vdf/chiavdf
          git clone https://github.com/Chia-Network/mpir_gc_x64.git
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Workspace (Release)
        run: cargo build --release --workspace
      - name: Package Artifacts
        shell: bash
        run: |
          NSP=$(jq -r '.network.nsp' network.json)
          mkdir -p artifacts minimal_pkg full_pkg node_host_pkg
          
          cp target/release/kinetic-daemon.exe minimal_pkg/${NSP}-daemon.exe
          cp target/release/kinetic-cli.exe minimal_pkg/${NSP}.exe
          cp target/release/kinetic-pac.exe minimal_pkg/${NSP}-pac.exe
          (cd minimal_pkg && zip -r ../artifacts/${NSP}-minimal-windows.zip .)
          
          cp target/release/kinetic-daemon.exe full_pkg/${NSP}-daemon.exe
          cp target/release/kinetic-cli.exe full_pkg/${NSP}.exe
          cp target/release/kinetic-nrs.exe full_pkg/${NSP}-nrs.exe
          cp target/release/kinetic-pac.exe full_pkg/${NSP}-pac.exe
          (cd full_pkg && zip -r ../artifacts/${NSP}-full-windows.zip .)
          
          cp target/release/kinetic-cli.exe node_host_pkg/${NSP}.exe
          cp target/release/kinetic-node.exe node_host_pkg/${NSP}-node.exe
          cp target/release/kinetic-host.exe node_host_pkg/${NSP}-host.exe
          (cd node_host_pkg && zip -r ../artifacts/${NSP}-node-host-windows.zip .)
          
          cd artifacts && sha256sum * > checksums-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: artifacts/*

  publish_release:
    name: Publish GitHub Release
    needs: [build_linux_gnu, build_linux_musl, build_macos, build_windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
