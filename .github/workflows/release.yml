name: Build and Release Binaries

on:
  release:
    types: [created]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build_linux_gnu:
    name: Build Linux GNU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev clang libclang-dev
      - name: Build Workspace (Release)
        run: cargo build --release --workspace
      - name: Rename and Upload Artifacts
        run: |
          NETWORK_ID=$(jq -r '.network.network_id' network.json)
          mkdir -p artifacts
          cp target/release/${NETWORK_ID}-daemon artifacts/${NETWORK_ID}-daemon-linux-gnu
          cp target/release/${NETWORK_ID} artifacts/${NETWORK_ID}-cli-linux-gnu
          cp target/release/${NETWORK_ID}-node artifacts/${NETWORK_ID}-node-linux-gnu
          cp target/release/${NETWORK_ID}-host artifacts/${NETWORK_ID}-host-linux-gnu
          cp target/release/${NETWORK_ID}-keygen artifacts/${NETWORK_ID}-keygen-linux-gnu
          cp target/release/${NETWORK_ID}-dns artifacts/${NETWORK_ID}-dns-server-linux-gnu
          cp target/release/${NETWORK_ID}-pac artifacts/${NETWORK_ID}-pac-linux-gnu
          if command -v sha256sum >/dev/null 2>&1; then
            cd artifacts && sha256sum * > checksums-linux-gnu.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-gnu-binaries
          path: artifacts/*

  build_linux_musl:
    name: Build Linux Musl (Alpine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install musl C++ compiler
        run: |
          wget -q https://musl.cc/x86_64-linux-musl-cross.tgz
          tar xzf x86_64-linux-musl-cross.tgz
          echo "$PWD/x86_64-linux-musl-cross/bin" >> $GITHUB_PATH
          echo "CC=x86_64-linux-musl-gcc" >> $GITHUB_ENV
          echo "CXX=x86_64-linux-musl-g++" >> $GITHUB_ENV
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build Workspace (Release)
        run: cargo build --release --workspace --target x86_64-unknown-linux-musl
      - name: Rename and Upload Artifacts
        run: |
          NETWORK_ID=$(jq -r '.network.network_id' network.json)
          mkdir -p artifacts
          cp target/x86_64-unknown-linux-musl/release/${NETWORK_ID}-daemon artifacts/${NETWORK_ID}-daemon-linux-musl
          cp target/x86_64-unknown-linux-musl/release/${NETWORK_ID} artifacts/${NETWORK_ID}-cli-linux-musl
          cp target/x86_64-unknown-linux-musl/release/${NETWORK_ID}-node artifacts/${NETWORK_ID}-node-linux-musl
          cp target/x86_64-unknown-linux-musl/release/${NETWORK_ID}-host artifacts/${NETWORK_ID}-host-linux-musl
          cp target/x86_64-unknown-linux-musl/release/${NETWORK_ID}-keygen artifacts/${NETWORK_ID}-keygen-linux-musl
          cp target/x86_64-unknown-linux-musl/release/${NETWORK_ID}-dns artifacts/${NETWORK_ID}-dns-server-linux-musl
          cp target/x86_64-unknown-linux-musl/release/${NETWORK_ID}-pac artifacts/${NETWORK_ID}-pac-linux-musl
          if command -v sha256sum >/dev/null 2>&1; then
            cd artifacts && sha256sum * > checksums-linux-musl.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-musl-binaries
          path: artifacts/*

  build_macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: brew install gmp
      - name: Build Workspace (Release)
        run: cargo build --release --workspace
      - name: Rename and Upload Artifacts
        run: |
          NETWORK_ID=$(jq -r '.network.network_id' network.json)
          mkdir -p artifacts
          cp target/release/${NETWORK_ID}-daemon artifacts/${NETWORK_ID}-daemon-macos
          cp target/release/${NETWORK_ID} artifacts/${NETWORK_ID}-cli-macos
          cp target/release/${NETWORK_ID}-node artifacts/${NETWORK_ID}-node-macos
          cp target/release/${NETWORK_ID}-host artifacts/${NETWORK_ID}-host-macos
          cp target/release/${NETWORK_ID}-keygen artifacts/${NETWORK_ID}-keygen-macos
          cp target/release/${NETWORK_ID}-dns artifacts/${NETWORK_ID}-dns-server-macos
          cp target/release/${NETWORK_ID}-pac artifacts/${NETWORK_ID}-pac-macos
          if command -v sha256sum >/dev/null 2>&1; then
            cd artifacts && sha256sum * > checksums-macos.txt
          else
            cd artifacts && shasum -a 256 * > checksums-macos.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: artifacts/*

  build_windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Enable Longpaths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install MPIR
        run: |
          cd kinetic-vdf/chiavdf
          git clone https://github.com/Chia-Network/mpir_gc_x64.git
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Workspace (Release)
        run: cargo build --release --workspace
      - name: Rename and Upload Artifacts
        shell: bash
        run: |
          NETWORK_ID=$(jq -r '.network.network_id' network.json)
          mkdir -p artifacts
          cp target/release/${NETWORK_ID}-daemon.exe artifacts/${NETWORK_ID}-daemon-windows.exe
          cp target/release/${NETWORK_ID}.exe artifacts/${NETWORK_ID}-cli-windows.exe
          cp target/release/${NETWORK_ID}-node.exe artifacts/${NETWORK_ID}-node-windows.exe
          cp target/release/${NETWORK_ID}-host.exe artifacts/${NETWORK_ID}-host-windows.exe
          cp target/release/${NETWORK_ID}-keygen.exe artifacts/${NETWORK_ID}-keygen-windows.exe
          cp target/release/${NETWORK_ID}-dns.exe artifacts/${NETWORK_ID}-dns-server-windows.exe
          cp target/release/${NETWORK_ID}-pac.exe artifacts/${NETWORK_ID}-pac-windows.exe
          cd artifacts && sha256sum * > checksums-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: artifacts/*

  publish_release:
    name: Publish GitHub Release
    needs: [build_linux_gnu, build_linux_musl, build_macos, build_windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
