[package]
name = "kinetic-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kinetic-core = { path = "../kinetic-core" }
kinetic-network = { path = "../kinetic-network" }
kinetic-storage = { path = "../kinetic-storage" }
kinetic-vdf = { path = "../kinetic-vdf" }
kinetic-kid = { path = "../kinetic-kid" }
kinetic-types = { version = "0.2.0", path = "../kinetic-types" }
tokio = { workspace = true, features = ["net"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libp2p = { version = "0.53", features = ["ed25519", "tokio", "macros"] }
axum = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
hex = "0.4.3"
dirs = "6.0.0"
hyper = { version = "1.10.1", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
http-body-util = "0.1.3"
bytes = "1.12.0"
http = "1.4.2"
reqwest = { version = "0.13.4", features = ["stream"] }
ed25519-dalek = "2.2.0"
clap = { version = "4.6.1", features = ["derive"] }
service-manager = "0.11.0"
futures-util = "0.3"
percent-encoding = "2.3.1"

[dev-dependencies]
proptest = "1.11.0"
