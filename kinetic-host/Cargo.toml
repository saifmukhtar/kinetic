[package]
name = "kinetic-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The HTTP-to-P2P load balancing proxy and CDN edge node for the Kinetic Network."
readme = "README.md"

[dependencies]
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive"] }
ed25519-dalek.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
kinetic-core.workspace = true
kinetic-local.workspace = true
kinetic-kyn.workspace = true
kinetic-network.workspace = true
kinetic-storage.workspace = true
kinetic-types.workspace = true
kinetic-vdf.workspace = true
libp2p = { workspace = true, features = ["ed25519", "tokio", "macros"] }
percent-encoding.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
service-manager.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
kinetic-primitives = { version = "0.2.0", path = "../kinetic-primitives" }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
