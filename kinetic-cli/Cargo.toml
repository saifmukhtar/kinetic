[package]
name = "kinetic-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kinetic"
path = "src/main.rs"

[features]
simulation = ["kinetic-core/simulation", "kinetic-kid/simulation"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
bincode.workspace = true
bip39.workspace = true
clap = { workspace = true, features = ["derive"] }
data-encoding = "2.11.1"
dialoguer = "0.12.0"
dirs.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
kinetic-core = { path = "../kinetic-core" }
kinetic-kid = { path = "../kinetic-kid" }
kinetic-local = { path = "../kinetic-local" }
kinetic-network = { path = "../kinetic-network" }
kinetic-primitives = { path = "../kinetic-primitives" }
kinetic-rpc = { path = "../kinetic-rpc" }
kinetic-vdf = { path = "../kinetic-vdf" }
libp2p = { workspace = true, features = ["ed25519"] }
rand.workspace = true
rand_chacha = "0.10.0"
rand_core = { workspace = true, features = ["std", "getrandom"] }
reqwest = { workspace = true, features = ["json"] }
rpassword = "7.5.4"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
axum.workspace = true
mockito = "1.7.2"
tempfile.workspace = true
tokio.workspace = true

