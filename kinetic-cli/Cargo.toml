[package]
name = "kinetic-cli"
description = "The official command-line interface for the Kinetic network daemon"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kinetic"
path = "src/main.rs"

[features]
simulation = ["kinetic-core/simulation", "kinetic-kid/simulation"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
bip39.workspace = true
clap = { workspace = true, features = ["derive"] }
colored.workspace = true
comfy-table.workspace = true
data-encoding.workspace = true
dirs.workspace = true
getrandom.workspace = true
hex.workspace = true
indicatif.workspace = true
kinetic-core.workspace = true
kinetic-kid.workspace = true
kinetic-kyn.workspace = true
kinetic-local.workspace = true
kinetic-network.workspace = true
kinetic-primitives.workspace = true
kinetic-rpc.workspace = true
reqwest = { workspace = true, features = ["json"] }
rpassword.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
axum.workspace = true
mockito.workspace = true
tempfile.workspace = true
tokio.workspace = true


[lints]
workspace = true
