[package]
name = "kinetic-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The background service and REST API gateway for local node administration and routing."
readme = "README.md"

[lib]
name = "kinetic_daemon"
path = "src/lib.rs"

[[bin]]
name = "kinetic-daemon"
path = "src/main.rs"

[features]
simulation = ["kinetic-core/simulation", "kinetic-kid/simulation"]

[dependencies]
anyhow.workspace = true
async-stream = "0.3"
axum = { workspace = true, features = ["ws"] }
bincode.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive"] }
dirs.workspace = true
ed25519-dalek.workspace = true
futures-util = "0.3"
getrandom.workspace = true
hex.workspace = true
hickory-server.workspace = true
http-body-util.workspace = true
hyper = { version = "1.10.1", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
keyring = "3.6.2"
kinetic-core = { path = "../kinetic-core" }
kinetic-kid = { path = "../kinetic-kid" }
kinetic-local = { path = "../kinetic-local" }
kinetic-network = { path = "../kinetic-network" }
kinetic-nrs = { path = "../kinetic-nrs" }
kinetic-primitives = { path = "../kinetic-primitives" }
kinetic-rpc = { path = "../kinetic-rpc" }
kinetic-storage = { path = "../kinetic-storage" }
kinetic-types = { path = "../kinetic-types" }
kinetic-vdf = { path = "../kinetic-vdf" }
kinetic-verify = { path = "../kinetic-verify" }
libp2p = { workspace = true, features = ["ed25519"] }
percent-encoding.workspace = true
rand.workspace = true
rcgen = { version = "0.13.2", features = ["x509-parser"] }
reqwest = { workspace = true, features = ["json", "stream"] }
rustls = { version = "0.23.41", features = ["ring"] }
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.14.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
service-manager.workspace = true
subtle = "2.6.1"
thiserror.workspace = true
time = "0.3.51"
tokio = { workspace = true, features = ["net"] }
tokio-rustls = "0.26.4"
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7.0", features = ["fs", "cors"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
http = "1.4.2"
httptest = "0.16.4"
proptest.workspace = true
tempfile.workspace = true
tower = { version = "0.5.3", features = ["util"] }
turmoil = "0.7.2"
