[package]
name = "kinetic-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The background service and REST API gateway for local node administration and routing."
readme = "README.md"

[lib]
name = "kinetic_daemon"
path = "src/lib.rs"

[[bin]]
name = "kinetic-daemon"
path = "src/main.rs"

[features]
simulation = ["kinetic-core/simulation", "kinetic-kid/simulation"]

[dependencies]
lru.workspace = true
anyhow.workspace = true
async-stream.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["ws"] }
bincode.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive"] }
dirs.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
hickory-server.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["full"] }
hyper-util = { workspace = true, features = ["full"] }
keyring.workspace = true
kinetic-core.workspace = true
kinetic-kid.workspace = true
kinetic-kyn.workspace = true
kinetic-local.workspace = true
kinetic-network.workspace = true
kinetic-nrs.workspace = true
kinetic-primitives.workspace = true
kinetic-rpc.workspace = true
kinetic-storage.workspace = true
kinetic-types.workspace = true
kinetic-vdf.workspace = true
kinetic-verify.workspace = true
libp2p = { workspace = true, features = ["ed25519"] }
percent-encoding.workspace = true
rand.workspace = true
# rcgen 0.14+ has major API breaking changes to Issuer/CertificateParams.
# We lock to 0.13.2 to avoid complex CA generation refactoring in the proxy.
rcgen = { workspace = true, features = ["x509-parser"] }
reqwest = { workspace = true, features = ["json", "stream"] }
rustls = { workspace = true, features = ["ring"] }
rustls-pemfile.workspace = true
rustls-pki-types.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
service-manager.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-rustls.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
tower-http = { workspace = true, features = ["fs", "cors"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
http.workspace = true
httptest.workspace = true
proptest.workspace = true
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
turmoil.workspace = true

[lints]
workspace = true
