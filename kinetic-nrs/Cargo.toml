[package]
name = "kinetic-nrs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Name Resolution System (NRS) for the Kinetic Network."
readme = "README.md"

[features]
simulation = ["kinetic-core/simulation"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive"] }
hickory-proto.workspace = true
hickory-resolver = { workspace = true, features = ["dns-over-https-rustls", "webpki-roots", "system-config"] }
hickory-server.workspace = true
kinetic-core = { path = "../kinetic-core" }
kinetic-local = { path = "../kinetic-local" }
kinetic-verify = { path = "../kinetic-verify" }
moka = { version = "0.12", features = ["future"] }
reqwest = { workspace = true, features = ["json"] }
serde_json.workspace = true
service-manager.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
privdrop = "0.5.6"

[dev-dependencies]
axum.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
kinetic-primitives = { path = "../kinetic-primitives" }
proptest.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
